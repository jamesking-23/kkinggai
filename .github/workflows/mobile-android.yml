name: Mobile (Android)
# Builds the Expo app into an installable APK and a Play-Store AAB on a GitHub runner, with no Expo account.
# It runs `expo prebuild` and Gradle directly. Run it from the Actions tab (workflow_dispatch) or push a tag named mobile-v*.
# The runner already includes the Android SDK. Needs two repository VARIABLES (Settings > Secrets and variables > Actions > Variables), both public by design:
#   SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY. Never put a service-role key here.
# The APK is always signed with the public Expo debug key: that keeps in-place updates working for phones that already have the app, and it is for sideloading only.
# The AAB (for Google Play) is re-signed with YOUR upload key when these four repository SECRETS exist, and is NOT uploadable to Play without them:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD. See docs/PLAY_STORE.md. Never commit the keystore.
on:
  workflow_dispatch:
  push:
    tags: ["mobile-v*"]

permissions:
  contents: write # to publish the build as a GitHub Release (uses the built-in token, no secret)

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_BUILD_NUMBER: ${{ github.run_number }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: pnpm install --frozen-lockfile
      - name: Check the build variables are set
        run: |
          test -n "$EXPO_PUBLIC_SUPABASE_URL" || { echo "Repository variable SUPABASE_URL is not set"; exit 1; }
          test -n "$EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "Repository variable SUPABASE_PUBLISHABLE_KEY is not set"; exit 1; }
      - name: Mobile tests
        run: pnpm --filter @kkingg/mobile test
      - name: Stamp the build number into the app
        working-directory: apps/mobile
        run: |
          jq '.expo.android.versionCode = (env.EXPO_PUBLIC_BUILD_NUMBER | tonumber)' app.json > app.tmp && mv app.tmp app.json
      - name: Generate the native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install
      - name: Build APK and AAB
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease bundleRelease --no-daemon
      - name: Sign the AAB with the Play upload key (only when the keystore secrets exist)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "Upload keystore secrets are not all set: the AAB stays debug-signed and Google Play will reject it."
            exit 0
          fi
          AAB=$(ls apps/mobile/android/app/build/outputs/bundle/release/*.aab | head -1)
          KS="$RUNNER_TEMP/upload.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
          printf '%s' "$KEYSTORE_PASSWORD" > "$RUNNER_TEMP/storepass"
          printf '%s' "$KEY_PASSWORD" > "$RUNNER_TEMP/keypass"
          # Remove the debug signature, then sign with the upload key (Play accepts only the upload key's signature).
          zip -q -d "$AAB" 'META-INF/*' || true
          jarsigner -keystore "$KS" -storepass:file "$RUNNER_TEMP/storepass" -keypass:file "$RUNNER_TEMP/keypass" \
            -sigalg SHA256withRSA -digestalg SHA-256 "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$AAB"
          echo "AAB upload-key certificate (register this with Play if asked):"
          keytool -printcert -jarfile "$AAB" | grep -E "Owner|SHA256"
          rm -f "$KS" "$RUNNER_TEMP/storepass" "$RUNNER_TEMP/keypass"
      - name: Print the signing certificate (must be identical across builds for in-place updates)
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs apps/mobile/android/app/build/outputs/apk/release/app-release.apk | grep -i "SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: kkingg-ai-android
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
      - name: Publish the APK as a GitHub Release (what the in-app "Check for updates" reads)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/mobile-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk kkingg-ai.apk
          gh release create "android-${{ github.run_number }}" kkingg-ai.apk \
            --title "Android build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Debug-signed, for sideloading." --target "${{ github.sha }}"
