name: Desktop (Windows)
# Builds the Tauri Windows installers on a Windows runner and uploads them as a workflow artifact.
# Run it from the Actions tab (workflow_dispatch) or by pushing a tag named desktop-v*.
on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: pnpm install --frozen-lockfile
      - name: Rust tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build installers
        run: pnpm --filter @kkingg/desktop build
      - uses: actions/upload-artifact@v4
        with:
          name: kkingg-ai-windows
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
